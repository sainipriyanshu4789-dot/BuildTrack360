<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BuildTrack 360{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<!-- Level 2 Task 2: responsive navbar that becomes a hamburger menu on small screens -->
<nav class="navbar navbar-expand-lg navbar-dark bg-navy sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{{ url_for('landing') }}"><i class="bi bi-buildings"></i> BuildTrack 360</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('projects') }}"><i class="bi bi-kanban"></i> Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('workers') }}"><i class="bi bi-people"></i> Workers</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('materials') }}"><i class="bi bi-box-seam"></i> Materials</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('expenses') }}"><i class="bi bi-cash-coin"></i> Expenses</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('photos') }}"><i class="bi bi-camera"></i> Photos</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container-fluid py-4 px-3 px-lg-4">
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="alert alert-info">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
